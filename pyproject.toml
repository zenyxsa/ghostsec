[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostsec"
version = "0.1.0"
description = "Python cybersecurity toolkit for defensive security research, authorized assessments, and OSINT"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/UPSTREAM-MIT.txt"]
authors = [
  { name = "zenyxsa" },
]
dependencies = [
  "colorama>=0.4.6",
  "phonenumbers>=9.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "ddgs>=9.0.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0.0"]

[project.scripts]
ghostsec = "ghostsec:main"

[tool.setuptools]
py-modules = ["ghostsec", "osint"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_core*", "agents*", "ghostsec_engine*"]
